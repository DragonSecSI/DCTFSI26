name: "Expensive Locksmith"
author: "CraftByte"
category: "misc"
description: |
  I lost my apartment building keyfob and the locksmith is
  charging me an arm and a leg to replace it. Can you help
  me so I don't have to pay the locksmith $200 for a new keyfob
  next time I lose it?

  I was able to get a trace of him programming a new keyfob for another
  building, maybe you can find something useful in there.

  Come pick up my keyfob at the registration desk, so you can get the correct data
  for my building.

  Note: This challenge should be solvable with any modern Android phone with NFC capabilities.
  If your team doesn't have one, come to the registration desk and we can lend you one to use for the challenge.

attribution: "CraftByte"
value: 10
logic: any
type: "standard"

