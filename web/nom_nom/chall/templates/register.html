{% extends "base.html" %}

{% block content %}
<section class="auth-layout">
    <div class="story-card">
        <p class="eyebrow">Join the kitchen</p>
        <h1>Create your Sandwich Lab account</h1>
        <p>Open your tray, get access to reset tools, and join the daily build-your-own sandwich grind.</p>
        <img src="{{ url_for('static', filename='images/sandwich-left.svg') }}" alt="Sandwich with toppings illustration">
    </div>
    <form class="panel" method="post" autocomplete="off">
        <h2>Register</h2>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="8" required>

        <button type="submit">Create Account</button>
        <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Log in</a>.</p>
    </form>
</section>
{% endblock %}
