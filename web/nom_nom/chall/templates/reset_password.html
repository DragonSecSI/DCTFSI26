{% extends "base.html" %}

{% block content %}
<section class="single-panel reveal">
    <form class="panel panel-wide" method="post" autocomplete="off">
        <p class="eyebrow">Finish reset</p>
        <h1>Choose a new password</h1>
        <p>Paste the reset token from the email and set a fresh password for your account.</p>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ email }}" required>

        <label for="token">Reset Token</label>
        <input id="token" name="token" type="text" value="{{ token }}" required>

        <label for="new_password">New Password</label>
        <input id="new_password" name="new_password" type="password" minlength="8" required>

        <button type="submit">Update Password</button>

        <div class="inline-illustration">
            <img src="{{ url_for('static', filename='images/sandwich-left.svg') }}" alt="Layered sandwich icon">
        </div>
    </form>
</section>
{% endblock %}
